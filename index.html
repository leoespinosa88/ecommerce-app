<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>shop-world</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>

    <header>
    <nav class="navbar color-shop-world">
      <div class="container-fluid">
       <a class="navbar-brand d-flex align-items-center gap-2" >
        <img src="img/globo.svg" alt="logo ">
        shop-world
        </a>
     <form class="d-flex flex-grow-1 justify-content-center search-form" role="search">
      <input class="form-control me-2" type="search" id="inputSearch" placeholder="Buscar producto"/> <!--- aria-label="Search"/-->
      <!--<button class="btn btn-outline-success" type="submit">Buscar</button> -->
    </form>

    <div class="position-relative flex-shrink-0">
       <button class="btn btn-outline-secondary carrito-btn"
          data-bs-toggle="offcanvas"
          data-bs-target="#carritoCanvas">
        <img src="img/carrito-de-compras.png" alt="logo carrito de compras"></button>
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
         0 </span>
    </div>
  </div>
</nav>
    </header>
    <main class="container-fluid py-4">
     <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-4" id="product-card">
  
  </div>

    </main>

    
    <footer class="color-shop-world py-4 my-4 ">
      <div class="container ">
        <div class="row align-items-center ">
          <div class="col-md-4 flex aling-items-center gap-2 mb-3 mb-md-0">
             <img src="img/globo.svg" alt="logo" width="35">
           <span class="fw-bold fs-5">Shop-world</span>
           </div>
          <div class="col-md-4 mb-3 mb-md-0">
          <ul class="nav justify-content-center list-unstyled d-flex gap-3">
            <li><a class="hover-primary" href="#">Inicio</a></li>
             <li><a class="hover-primary" href="#">Productos</a></li>
             <li><a class="hover-primary" href="#">Contacto</a></li>
             </ul>
             </div>
             <div class="col-md-4 text-md-end text-center">
              <small>&copy; 2026 shop-world. Todos los derechos reservados. </small>
             </div>
        </div>
      
    </footer>

    <div class="modal fade" id="modalProducto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body">
      </div>
    </div>
  </div>
</div>

<div class="toast position-fixed bottom-0 end-0 p-3" id="toastCarrito">
  <div class="toast-body bg-success text-white">
       Producto agregado al carrito
  </div>
</div>
<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoCanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Carrito de compras</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <div id="lista-carrito"></div>

    <button class="btn btn-danger w-100 mt-3" id="vaciar-carrito">
      Finalizar compra
    </button>
  </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
